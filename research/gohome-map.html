];
// 좌표는 카카오맵 WCONGNAMUL(2.5단위 = 1m). 그대로 평면 좌표로 쓴다.
const UNIT_PER_M=2.5;
const START={x:465583,y:459600,name:"그린컴퓨터아카데미"}, END={x:475390,y:466684,name:"태봉초"};
const STOPS=[
 {n:"치평역1번출구",x:465528,y:460067,a:"r"},{n:"한국국토정보공사",x:465526,y:461084,a:"r"},
 {n:"상무대우아파트",x:465267,y:461402,a:"l"},{n:"대우디오빌",x:465999,y:459756,a:"r"},
 {n:"시청광주청사",x:466861,y:461787,a:"t"},{n:"광주종합버스터미널",x:472609,y:462516,a:"b"},
 {n:"경신여고",x:474656,y:465600,a:"l"},{n:"용봉현대1차아파트",x:474728,y:466902,a:"l"}
];
const LINES={"1001":"--c1001","1003":"--c1003","13":"--c13","14":"--c14","01":"--c01",feed:"--cfeed"};
const LEG_NAME={"1001":"1001 (직행)","1003":"1003","13":"13","14":"14","01":"01",feed:"환승 전 여러 버스"};
DATA.forEach(r=>r.steps.forEach(s=>{const a=s.p.split(",").map(Number);s.pts=[];for(let i=0;i<a.length;i+=2)s.pts.push([a[i],a[i+1]]);}));
const lineKey=s=>s.v.length>2?"feed":s.v[0];
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colorOf=s=>s.t==="W"?cssv("--walk"):cssv(LINES[lineKey(s)]);

const ORDERS={transfer:[1,2,3,5,7,4,6],time:[1,4,6,2,3,5,7]};
let order="transfer", selected=1, showAll=false;

// 경계
let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
DATA.forEach(r=>r.steps.forEach(s=>s.pts.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);})));
const svg=document.getElementById("map");
let view={cx:(minX+maxX)/2,cy:(minY+maxY)/2,s:1};
function fit(){const w=svg.clientWidth,h=svg.clientHeight;const pad=60;view.cx=(minX+maxX)/2;view.cy=(minY+maxY)/2;view.s=Math.max((maxX-minX)/(w-pad*2),(maxY-minY)/(h-pad*2));}
const P=(x,y)=>[(x-view.cx)/view.s+svg.clientWidth/2,(view.cy-y)/view.s+svg.clientHeight/2];

function offsetPts(pts,d){ // d: 화면 px 단위 평행 이동
  const sp=pts.map(([x,y])=>P(x,y)); if(!d)return sp;
  const out=[];
  for(let i=0;i<sp.length;i++){
    let nx=0,ny=0;
    for(const j of [i-1,i]){const a=sp[j],b=sp[j+1];if(!a||!b)continue;const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);if(L<.01)continue;nx+=-dy/L;ny+=dx/L;}
    const L=Math.hypot(nx,ny)||1; out.push([sp[i][0]+nx/L*d,sp[i][1]+ny/L*d]);
  }
  return out;
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const poly=(pts,attrs)=>`<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke-linejoin="round" stroke-linecap="round" ${attrs}/>`;

function render(){
  const w=svg.clientWidth,h=svg.clientHeight; if(!w||!h)return;
  let g="";
  // 1km 격자
  const step=1000*UNIT_PER_M, grid=cssv("--grid");
  const x0=view.cx-w/2*view.s, x1=view.cx+w/2*view.s, y0=view.cy-h/2*view.s, y1=view.cy+h/2*view.s;
  for(let x=Math.ceil(x0/step)*step;x<x1;x+=step){const [px]=P(x,0);g+=`<line x1="${px}" y1="0" x2="${px}" y2="${h}" stroke="${grid}" stroke-width="1"/>`;}
  for(let y=Math.ceil(y0/step)*step;y<y1;y+=step){const [,py]=P(0,y);g+=`<line x1="0" y1="${py}" x2="${w}" y2="${py}" stroke="${grid}" stroke-width="1"/>`;}
  const ids=ORDERS[order];
  const draw=(r,idx,focus)=>{
    const off=showAll?(idx-3)*3.2:0;
    r.steps.forEach(s=>{
      const op=focus?1:.13;
      if(s.t==="W") g+=poly(offsetPts(s.pts,0),`stroke="${colorOf(s)}" stroke-width="3" stroke-dasharray="1 6" opacity="${op}"`);
      else{
        const pts=offsetPts(s.pts,off);
        if(focus) g+=poly(pts,`stroke="${cssv("--land")}" stroke-width="${showAll?6:9}" opacity="1"`);
        g+=poly(pts,`stroke="${colorOf(s)}" stroke-width="${showAll?3.5:5.5}" opacity="${op}"`);
      }
    });
  };
  const sel=DATA.find(r=>r.rank===selected);
  ids.forEach((id,i)=>{const r=DATA.find(d=>d.rank===id); if(showAll||r!==sel) draw(r,i,showAll);});
  if(!showAll) draw(sel,0,true);
  // 정류장
  const fg=cssv("--fg"),land=cssv("--land"),muted=cssv("--muted");
  const used=new Set(); if(!showAll) sel.steps.forEach(s=>{if(s.t==="B"){used.add(s.from);used.add(s.to);}});
  STOPS.forEach(st=>{
    const on=showAll||used.has(st.n); const [px,py]=P(st.x,st.y);
    const dx={r:9,l:-9,t:0,b:0}[st.a], dy={r:4,l:4,t:-10,b:16}[st.a], an={r:"start",l:"end",t:"middle",b:"middle"}[st.a];
    g+=`<circle cx="${px}" cy="${py}" r="${on?5:3.5}" fill="${land}" stroke="${on?fg:muted}" stroke-width="2" opacity="${on?1:.55}"/>`;
    g+=`<text x="${px+dx}" y="${py+dy}" text-anchor="${an}" font-size="12" font-weight="${on?700:400}" fill="${on?fg:muted}" opacity="${on?1:.7}" paint-order="stroke" stroke="${land}" stroke-width="4" stroke-linejoin="round">${esc(st.n)}</text>`;
  });
  // 출발/도착
  [[START,cssv("--start"),"출발"],[END,cssv("--end"),"도착"]].forEach(([pt,c,lab])=>{
    const [px,py]=P(pt.x,pt.y);
    g+=`<circle cx="${px}" cy="${py}" r="9" fill="${c}" stroke="${land}" stroke-width="3"/>`;
    g+=`<text x="${px}" y="${py+26}" text-anchor="middle" font-size="13" font-weight="700" fill="${fg}" paint-order="stroke" stroke="${land}" stroke-width="4">${lab} · ${esc(pt.name)}</text>`;
  });
  // 축척 막대
  const mPerPx=view.s/UNIT_PER_M; let m=[100,200,500,1000,2000,5000].find(v=>v/mPerPx>=70)||5000; const len=m/mPerPx;
  g+=`<g transform="translate(${w-len-18},${h-22})"><rect x="-6" y="-18" width="${len+12}" height="28" rx="5" fill="${land}" opacity=".9"/><line x1="0" y1="0" x2="${len}" y2="0" stroke="${fg}" stroke-width="2"/><line x1="0" y1="-5" x2="0" y2="0" stroke="${fg}" stroke-width="2"/><line x1="${len}" y1="-5" x2="${len}" y2="0" stroke="${fg}" stroke-width="2"/><text x="${len/2}" y="-6" text-anchor="middle" font-size="11" fill="${fg}">${m>=1000?m/1000+" km":m+" m"}</text></g>`;
  // 북쪽 표시
  g+=`<g transform="translate(26,30)"><text x="0" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="${muted}">N</text><path d="M0 4 L5 16 L0 13 L-5 16 Z" fill="${muted}"/></g>`;
  svg.innerHTML=g;
}

function chips(r){
  const bus=r.steps.filter(s=>s.t==="B");
  return bus.map((s,i)=>{const k=lineKey(s);const label=k==="feed"?s.v.slice(0,4).join("·")+"…":s.v.join(" 또는 ");
    return (i?'<span class="arrow">→</span>':"")+`<span class="chip" style="background:var(${LINES[k]})">${esc(label)}</span>`;}).join("");
}
function via(r){
  const bus=r.steps.filter(s=>s.t==="B");
  return bus.map(s=>s.from).concat(bus[bus.length-1].to).join(" → ");
}
function renderList(){
  const ul=document.getElementById("list");
  ul.innerHTML=ORDERS[order].map((id,i)=>{const r=DATA.find(d=>d.rank===id);
    return `<li><button class="route" type="button" data-rank="${id}" aria-pressed="${!showAll&&id===selected}">
      <span class="rank">${i+1}</span>
      <span><span class="legs">${chips(r)}</span><div class="via">${esc(via(r))}</div></span>
      <span><div class="time">${r.time}</div><div class="meta">${r.transfers?"환승 "+r.transfers+"회":"환승 없음"}</div><div class="meta">${r.fare} · 도보 ${r.walk}</div></span>
    </button></li>`;}).join("");
  ul.querySelectorAll(".route").forEach(b=>b.addEventListener("click",()=>{selected=+b.dataset.rank;showAll=false;renderList();render();}));
  document.getElementById("showall").textContent=showAll?"선택한 경로만 보기":"전체 경로 같이 보기";
}
function renderLegend(){
  const items=["1001","1003","13","14","01","feed"].map(k=>`<span><i class="sw" style="background:var(${LINES[k]})"></i>${LEG_NAME[k]}</span>`);
  items.push(`<span><i class="sw walk"></i>도보</span>`);
  document.getElementById("legend").innerHTML=items.join("");
}
function setOrder(o){order=o;document.getElementById("tab-transfer").setAttribute("aria-selected",o==="transfer");document.getElementById("tab-time").setAttribute("aria-selected",o==="time");renderList();render();}
document.getElementById("tab-transfer").onclick=()=>setOrder("transfer");
document.getElementById("tab-time").onclick=()=>setOrder("time");
document.getElementById("showall").onclick=()=>{showAll=!showAll;renderList();render();};

// 확대/이동
function zoomAt(f,sx,sy){const w=svg.clientWidth,h=svg.clientHeight;sx??=w/2;sy??=h/2;
  const wx=view.cx+(sx-w/2)*view.s, wy=view.cy-(sy-h/2)*view.s; view.s*=f; view.cx=wx-(sx-w/2)*view.s; view.cy=wy+(sy-h/2)*view.s; render();}
document.getElementById("zin").onclick=()=>zoomAt(1/1.5);
document.getElementById("zout").onclick=()=>zoomAt(1.5);
document.getElementById("zfit").onclick=()=>{fit();render();};
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1/1.2:1.2,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,cx:view.cx,cy:view.cy};svg.setPointerCapture(e.pointerId);svg.classList.add("drag");});
svg.addEventListener("pointermove",e=>{if(!drag)return;view.cx=drag.cx-(e.clientX-drag.x)*view.s;view.cy=drag.cy+(e.clientY-drag.y)*view.s;render();});
const end=()=>{drag=null;svg.classList.remove("drag");};
svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);

new ResizeObserver(()=>{fit();render();}).observe(svg);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
renderLegend();renderList();fit();render();
</script>
