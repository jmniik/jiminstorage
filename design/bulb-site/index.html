<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빛을 잃은 하루</title>
<style>
  html,body{margin:0;background:#0e1024;color:#f4f1ea;font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  #scroll{height:500vh;position:relative}
  #stage{position:sticky;top:0;height:100vh;width:100%;overflow:hidden}
  #c{display:block;width:100%;height:100%;image-rendering:pixelated}
  .cap{position:absolute;left:0;right:0;top:15vh;text-align:center;pointer-events:none;transition:opacity .35s}
  .cap b{display:block;font-family:'Pretendard',system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-weight:900;font-size:clamp(32px,5.2vw,64px);letter-spacing:.1em;text-shadow:0 3px 0 #000}
  .cap span{display:block;margin-top:12px;font-family:'Pretendard',system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-weight:600;font-size:clamp(16px,1.9vw,22px);letter-spacing:.08em;opacity:.85;text-shadow:0 2px 0 #000}
  .hint{position:absolute;left:50%;bottom:3vh;transform:translateX(-50%);text-align:center;white-space:nowrap;font-size:13px;letter-spacing:.2em;transition:opacity .3s;text-shadow:0 2px 0 #000;animation:bob 1.4s steps(2) infinite}
  .hint em{display:block;font-style:normal;font-family:'Pretendard',system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-weight:600;font-size:clamp(17px,2vw,22px);letter-spacing:.1em;margin-bottom:8px}
  @keyframes bob{50%{transform:translate(-50%,6px)}}
  .dots{position:absolute;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
  .dots i{width:10px;height:10px;outline:2px solid #000;transition:transform .2s}
  .dots i{cursor:pointer}
  .dots i:hover,.dots i:focus-visible{transform:scale(1.3);outline-color:#fff}
  .dots i.on{transform:scale(1.5)}
</style>
<div id="scroll">
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="cap" id="cap"><b>빛을 잃은 하루</b></div>
    <div class="cap" id="capEnd" style="opacity:0"><b>다시 켜지는 하루</b><span>빛의 숲에서 빛 조각 모으기</span></div>
    <div class="hint" id="hint"><em>빛 조각 찾으러 가기</em>SCROLL ▼</div>
    <div class="dots" id="dots"></div>
  </div>
</div>
<script>
/* ===== 기본 ===== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const buf=document.createElement('canvas'),g=buf.getContext('2d');
const PX=4;                                   // 화면 4px = 픽셀 1칸
let W,H,dpr,bw,bh;
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const hash=(a,b)=>{let h=(a*374761393+b*668265263)^0x5bd1e995;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296};
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const D=Math.PI/180;

/* ===== 장면 (노트 순서) =====
   0 밤 · 회색 도시 · 흰 전구
   1 밝은 배경 · 음식점 · 빨간 전구
   2 밝은 배경 · ACC · 초록 전구
   3 밝은 배경 · 구도청 · 전일빌딩 · 파란 전구
   4 노을 · ACC · 전일빌딩 · 노란 전구                    */
const SCENES=[
  {spr:'white', glow:null,          dot:'#cfcfd8'},
  {spr:'red',   glow:[255,80,80],   dot:'#ff4a4a'},
  {spr:'green', glow:[100,255,100], dot:'#56e04a'},
  {spr:'blue',  glow:[70,170,255],  dot:'#3aa5ff'},
  {spr:'yellow',glow:[255,210,100], dot:'#f5b942'},
];
const STEP=48;                                 // 장면마다 행성 48°씩 (건물 간격은 촘촘하게, 장면 길이는 짧게)
// 스크롤 0~1 → 장면 위치 0~4 (장면 i는 i/4 지점에서 정중앙)
function weights(p){
  const s=p*4,w=SCENES.map((_,i)=>{const d=Math.abs(s-i);return d<.38?1:d>.62?0:1-sm(.38,.62,d)});
  const t=w.reduce((a,b)=>a+b,0);return w.map(v=>v/t);
}

/* ===== 스프라이트: 색별 걷기 움짤 8프레임 (그림자 지움) ===== */
const FR={n:8,w:448,h:480,foot:399,body:363,idle:2};   // 프레임 크기, 발바닥 y, 몸 높이, 멈췄을 때 프레임
const SPR={};
SCENES.forEach(s=>{const i=new Image();i.src=`img/${s.spr}-walk.png?v=3`;SPR[s.spr]=i});

/* ===== 걷기: 스크롤할 때만 프레임이 넘어감 ===== */
let lastY=scrollY,phase=0,amp=0,lastMove=-1e9;
addEventListener('scroll',()=>{const dy=scrollY-lastY;lastY=scrollY;phase+=Math.abs(dy)*.03;lastMove=performance.now()},{passive:true});

function drawWalker(n,cx,baseY,dispH,alpha){
  const img=SPR[n];if(!img.complete||!img.naturalWidth||alpha<=0)return;
  const k=dispH/FR.body;
  // 스크롤 중이면 phase로 프레임 선택(한 걸음 사이클 = 8프레임), 멈추면 서 있는 프레임
  const f=amp>.5?Math.floor(phase/(Math.PI*2)*FR.n)%FR.n:FR.idle;
  ctx.save();ctx.globalAlpha=alpha;ctx.imageSmoothingEnabled=false;
  const dw=FR.w*k,dh2=FR.h*k;
  ctx.drawImage(img,f*FR.w,0,FR.w,FR.h,Math.round((cx-dw/2)*dpr),Math.round((baseY-FR.foot*k)*dpr),Math.round(dw*dpr),Math.round(dh2*dpr));
  ctx.restore();
}

/* ===== 건물 픽셀 스프라이트 ===== */
function spr(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);return c}
function tower(w,h,base,lit,litC,seed){return spr(w,h,(x)=>{
  x.fillStyle=rgb(base);x.fillRect(0,0,w,h);
  x.fillStyle=rgb(base.map(v=>v*1.25));x.fillRect(0,0,w,1);
  x.fillStyle=rgb(base.map(v=>v*.7));x.fillRect(w-1,0,1,h);
  for(let y=3;y<h-2;y+=3)for(let xx=2;xx<w-1;xx+=3){x.fillStyle=hash(seed+xx,y)<lit?litC:rgb(base.map(v=>v*.78));x.fillRect(xx,y,1,1)}
})}
function shop(w,h,base,awn,seed){return spr(w,h,(x)=>{
  x.fillStyle=rgb(base);x.fillRect(0,0,w,h);x.fillStyle=rgb(base.map(v=>v*.7));x.fillRect(w-1,0,1,h);
  x.fillStyle='#fff3c4';x.fillRect(2,2,w-4,3);x.fillStyle=awn;for(let i=3;i<w-3;i+=3)x.fillRect(i,3,1,1); // 간판
  for(let i=0;i<w;i++){x.fillStyle=i%4<2?awn:'#fff7ea';x.fillRect(i,h-9,1,3)}                      // 줄무늬 차양
  x.fillStyle='#ffe39a';x.fillRect(2,h-6,w/2-3|0,4);x.fillStyle='#5a3a2a';x.fillRect(w-6,h-6,3,6);  // 창, 문
  for(let y=8;y<h-11;y+=3)for(let xx=2;xx<w-1;xx+=3){x.fillStyle=hash(seed+xx,y)<.5?'#ffe39a':rgb(base.map(v=>v*.75));x.fillRect(xx,y,1,1)}
})}
const ACC=()=>spr(46,16,(x,w,h)=>{
  x.fillStyle='#2f5f7a';x.fillRect(0,3,w,h-3);
  for(let y=5;y<h;y+=3)for(let i=1;i<w-1;i+=2){x.fillStyle=hash(i,y)<.55?'#ffe08a':'#6fb6d6';x.fillRect(i,y,1,2)}
  x.fillStyle='#4f9a4a';x.fillRect(0,1,w,2);for(let i=1;i<w;i+=5){x.fillStyle='#7ccc60';x.fillRect(i,0,3,1)}
});
const SKYGARDEN=()=>spr(40,10,(x,w,h)=>{          // 하늘마당: ACC 위 잔디 광장
  x.fillStyle='#3f7d3a';x.fillRect(0,4,w,h-4);
  x.fillStyle='#69b84f';x.fillRect(1,3,w-2,2);
  for(let i=2;i<w-2;i+=3){x.fillStyle=hash(i,7)<.5?'#8fd46a':'#57a043';x.fillRect(i,2,1,1)}
  for(const tx of [5,w-8]){x.fillStyle='#6b4a2e';x.fillRect(tx+1,0,1,4);x.fillStyle='#2f8a3a';x.fillRect(tx,0,3,2)}
  x.fillStyle='#b9d9e6';for(let i=6;i<w-6;i+=8)x.fillRect(i,6,4,2);   // 아래 유리 채광창
});
const GUDO=()=>spr(26,14,(x,w,h)=>{              // 구도청(옛 전남도청): 흰 3층
  x.fillStyle='#8a6a58';x.fillRect(0,0,w,2);
  x.fillStyle='#efe9dc';x.fillRect(1,2,w-2,h-2);
  for(let y=4;y<h-1;y+=3)for(let i=3;i<w-2;i+=2){x.fillStyle='#55463f';x.fillRect(i,y,1,1)}
  x.fillStyle='#c9bfae';x.fillRect(w/2-2|0,h-5,4,5);
});
const JEONIL=()=>spr(15,44,(x,w,h)=>{             // 전일빌딩245: 높은 격자
  x.fillStyle='#e9e2d0';x.fillRect(0,0,w,h);x.fillStyle='#b9ae98';x.fillRect(w-2,0,2,h);
  x.fillStyle='#4a4a58';x.fillRect(0,0,w,3);
  for(let y=5;y<h-2;y+=4)for(let i=2;i<w-3;i+=3){x.fillStyle=hash(i,y)<.55?'#ffd36a':'#7a8696';x.fillRect(i,y,2,2)}
});

// 행성 위 건물 배치: th = 앞뒤 각도(장면 i 중심 = i*72°), lam = 좌우 각도
let WORLD=[];
function buildWorld(){
  WORLD=[];const warm=[[110,80,140],[150,90,110],[80,110,150],[170,110,90],[90,130,130]];
  SCENES.forEach((sc,i)=>{
    const c=i*STEP;
    for(let a=-30;a<=16;a+=6){                 // 건물 줄 간격 6° (원래 촘촘함), 장면마다 8줄
      for(const side of [-1,1])for(let n=0;n<2;n++){
        const r=hash(i*7+n*3+side,a*13), seed=(r*1e6)|0;
        const lam=side*(n?30+r*22:15+r*9);
        if(Math.abs(a+16)<5&&n===0)continue;     // 랜드마크 자리
        let sp;
        if(i===0){const v=60+r*35;sp=tower(7+(r*8|0),14+(hash(a,i+n)*26|0),[v,v,v+5],.12,rgb([v*1.4,v*1.4,v*1.45]),seed)}
        else if(i===1)sp=shop(10+(r*5|0),14+(hash(a,i)*8|0),warm[seed%5],['#e84a4a','#f08a2a','#d94a7a'][seed%3],seed);
        else sp=tower(7+(r*7|0),12+(hash(a,i+n)*22|0),warm[seed%5],.55,'#ffe08a',seed);
        WORLD.push({th:c+a+(hash(seed,1)-.5)*3,lam,s:sp});
      }
    }
    const L=(sp,side,label)=>WORLD.push({th:c-16,lam:side*20,s:sp,label});
    if(i===2){L(ACC(),-1,'ACC');L(SKYGARDEN(),1,'하늘마당')}
    if(i===3){L(GUDO(),-1,'구도청');L(JEONIL(),1,'전일빌딩245')}
    if(i===4){L(ACC(),-1,'ACC');L(JEONIL(),1,'전일빌딩245')}
  });
}

/* ===== 하늘 ===== */
const SKY={night:[[10,12,36],[44,46,86]],day:[[110,185,240],[214,236,250]],sunset:[[64,44,118],[252,150,88]]};
let STARS=[];
function sky(p){
  const n=1-sm(.07,.2,p), ss=sm(.84,.95,p);
  const dawn=Math.max(0,1-Math.abs(p-.13)/.08);   // 새벽: 지평선 쪽 분홍빛
  const top=mix(mix(SKY.day[0],SKY.night[0],n),SKY.sunset[0],ss), bot=mix(mix(mix(SKY.day[1],SKY.night[1],n),SKY.sunset[1],ss),[255,170,140],dawn*.6);
  for(let y=0;y<bh;y+=3){g.fillStyle=rgb(mix(top,bot,Math.min(1,y/(bh*.75))));g.fillRect(0,y,bw,3)}
  if(n>0){g.globalAlpha=n;g.fillStyle='#fff';STARS.forEach(([x,y,b])=>{if(b>.7||Math.sin(performance.now()/400+x)>-.3)g.fillRect(x,y,1,1)});g.globalAlpha=1}
}

/* ===== 화면 크기 ===== */
let PR,PCX,PCY;                                // 행성 반지름·중심(버퍼 픽셀)
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;bw=Math.ceil(W/PX);bh=Math.ceil(H/PX);buf.width=bw;buf.height=bh;
  PR=Math.round(Math.max(bw*.62,bh*.85));PCX=bw/2|0;PCY=Math.round(bh*.72)+PR;
  STARS=Array.from({length:Math.round(bw*bh/260)},(_,i)=>[hash(i,1)*bw|0,hash(1,i)*bh*.7|0,hash(i,i)]);
}
addEventListener('resize',resize);resize();buildWorld();

const dotsEl=document.getElementById('dots');
// 네모 누르면 그 장면으로 (스크롤로 이동하니까 가는 동안 전구가 걸어감)
SCENES.forEach((s,n)=>{const i=document.createElement('i');i.style.background=s.dot;i.tabIndex=0;i.setAttribute('role','button');
  const go=()=>{const max=document.getElementById('scroll').offsetHeight-innerHeight,from=scrollY,to=max*n/(SCENES.length-1);
    const dur=Math.min(2200,600+Math.abs(to-from)*.25),t0=performance.now();     // 멀수록 조금 더 오래(최대 2.2초)
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;scrollTo(0,from+(to-from)*e);if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step)};
  i.addEventListener('click',go);i.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
  dotsEl.appendChild(i)});
const capEl=document.getElementById('cap'),hint=document.getElementById('hint');

function frame(){
  const max=document.getElementById('scroll').offsetHeight-H;
  const p=Math.min(1,Math.max(0,scrollY/max));
  const moving=performance.now()-lastMove<130;
  amp+=((moving?1:0)-amp)*.18;if(!moving&&amp<.03)amp=0;
  const w=weights(p);
  // 스크롤 내리면 행성이 앞으로 굴러옴
  const rot=p*(SCENES.length-1)*STEP;

  g.imageSmoothingEnabled=false;
  sky(p);
  // 전구 빛 (8bit 동심원)
  const glow=[0,1,2].map(k=>SCENES.reduce((a,s,i)=>a+(s.glow?s.glow[k]:0)*w[i],0));
  const gs=SCENES.reduce((a,s,i)=>a+(s.glow?1:0)*w[i],0);
  const topY=PCY-PR, standY=Math.round(PCY-PR*Math.cos(26*D)), dh=Math.min(H*.3,W*.34), bulbH=dh/PX;
  if(gs>0)for(let r=6;r>=1;r--){const rr=r*bw*.03;g.fillStyle=rgb(glow);g.globalAlpha=.09*gs;
    for(let y=-rr;y<=rr;y+=2){const xw=Math.round(Math.sqrt(rr*rr-y*y));g.fillRect(PCX-xw,Math.round(standY-bulbH*.55+y),xw*2,2)}}
  g.globalAlpha=1;

  // 행성이 앞으로 굴러옴: 지평선 너머(phi<0)에서 솟아 → 전구 뒤를 지나 → 우리 쪽(화면 아래)으로
  const proj=(phi,lam)=>{const cl=Math.cos(lam);return{x:PCX+Math.sin(lam)*PR,y:PCY-PR*cl*Math.cos(phi),z:cl*Math.sin(phi),
    up:Math.hypot(Math.sin(lam),cl*Math.cos(phi)),ang:Math.atan2(Math.sin(lam),cl*Math.cos(phi))}};
  const labels=[],backB=[],frontB=[];
  for(const b of WORLD){
    const phi=rot-b.th;if(phi<-35||phi>70)continue;
    const q=proj(phi*D,b.lam*D);q.b=b;q.phi=phi;(q.z<0?backB:frontB).push(q);
  }
  const drawB=q=>{const b=q.b,k=(b.label?2:1.6)*(1+.8*Math.max(0,q.z)),sw=Math.round(b.s.width*k),sh=Math.max(1,Math.round(b.s.height*k*q.up));
    g.save();g.translate(q.x,q.y);g.rotate(q.ang);g.drawImage(b.s,Math.round(-sw/2),-sh+2,sw,sh);g.restore();
    if(b.label&&q.phi>2&&q.y<bh)labels.push({t:b.label,x:q.x*PX,y:q.y*PX,al:Math.min(1,(q.phi-2)/8)})};
  backB.forEach(drawB);
  // 행성
  const n=1-sm(.07,.2,p),ss=sm(.84,.95,p);
  const ground=mix(mix([120,168,96],[58,60,70],n),[150,96,90],ss);
  g.fillStyle=rgb(ground.map(v=>v*.8));g.beginPath();g.arc(PCX,PCY,PR,0,7);g.fill();
  g.fillStyle=rgb(ground.map(v=>v*1.15));g.beginPath();g.arc(PCX,PCY,PR-1,0,7);g.fill();
  g.fillStyle=rgb(ground);g.beginPath();g.arc(PCX,PCY,PR-3,0,7);g.fill();
  // 가운데 길 (앞으로 흘러옴)
  const road=mix(ground.map(v=>v*.62),[60,60,66],.4);
  for(let ph=0;ph<70;ph+=.5){const y=Math.round(PCY-PR*Math.cos(ph*D));if(y>bh)break;
    const hw=Math.round(bw*.045*(1+.8*Math.sin(ph*D)));g.fillStyle=rgb(road);g.fillRect(PCX-hw,y,hw*2,2);
    if((((rot-ph)%6)+6)%6<2.5){g.fillStyle=n>.5?'#9a9aa2':'#f3e6b0';g.fillRect(PCX-1,y,2,2)}}
  // 땅 무늬 (같이 굴러옴)
  for(let k=Math.floor((rot-70)/4);k<=Math.ceil(rot/4);k++){const phi=rot-k*4;if(phi<1)continue;
    for(let j=-8;j<=8;j++){if(Math.abs(j)<2)continue;const lam=(j*7+hash(k,j)*4)*D,q=proj(phi*D,lam);
      g.fillStyle=rgb(ground.map(v=>v*(hash(j,k)<.5?.85:1.12)));g.fillRect(Math.round(q.x),Math.round(q.y),1+(q.z>.3?1:0)+1,1)}}
  frontB.sort((a,b)=>a.z-b.z).forEach(drawB);
  // 전구 발밑 빛 웅덩이
  // 발밑 빛: 좁고 옅게 (예전 폭 24% → 지금 최대 11%)
  if(gs>0){g.globalAlpha=.16*gs;g.fillStyle=rgb(glow);for(let i=0;i<2;i++){g.beginPath();g.ellipse(PCX,standY+1,bw*(.055-i*.02),3-i,0,0,7);g.fill()}g.globalAlpha=1}
  // 그림자: 발 바로 밑 (땅에 붙어 있게)
  {const sw=dh/PX*.3;g.fillStyle='rgba(0,0,0,.32)';g.beginPath();g.ellipse(PCX,standY+1,sw,Math.max(1.5,sw*.14),0,0,7);g.fill()}

  ctx.imageSmoothingEnabled=false;ctx.drawImage(buf,0,0,bw,bh,0,0,W*dpr,H*dpr);

  // 이름표
  ctx.save();ctx.font=`bold ${13*dpr}px system-ui,sans-serif`;ctx.textAlign='center';
  for(const l of labels){ctx.globalAlpha=Math.min(1,l.al*2);ctx.fillStyle='#000';ctx.fillText(l.t,l.x*dpr+2,l.y*dpr+2+16*dpr);ctx.fillStyle='#fff';ctx.fillText(l.t,l.x*dpr,l.y*dpr+16*dpr)}
  ctx.restore();

  // 전구
  const base=(standY+1)*PX;                     // 꼭대기에서 26° 앞, 도로 두 번째 점선 근처
  SCENES.forEach((s,i)=>drawWalker(s.spr,W/2,base,dh,w[i]));

  // 자막·점·힌트
  const cur=Math.round(p*4);
  capEl.style.opacity=cur===0?1:0;              // 첫 장면(회색 도시)에만 제목
  document.getElementById('capEnd').style.opacity=cur===4?1:0;   // 마지막 장면(노란 전구) 제목
  hint.style.opacity=p>.02?0:.85;
  [...dotsEl.children].forEach((el,i)=>el.classList.toggle('on',i===cur));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
