<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>다시 켜지는 하루</title>
<style>
@font-face{font-family:Pretendard;font-weight:900;font-display:swap;src:url(fonts/Pretendard-Black.subset.woff2)}
@font-face{font-family:Pretendard;font-weight:600;font-display:swap;src:url(fonts/Pretendard-SemiBold.subset.woff2)}
*{box-sizing:border-box}
html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
html.lock{overflow:hidden}
body{margin:0;background:#0e1024;color:#f4f1ea;font-family:Pretendard,system-ui,"Malgun Gothic",sans-serif;font-weight:600;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid #fff;outline-offset:3px}
h1,h2,h3,p{margin:0}h1,h2,h3{font-weight:900}
.px{background:#fff;color:#14142b;border:4px solid #0a0a18;box-shadow:0 6px 0 #0a0a18;padding:.7em 1.4em;letter-spacing:.06em}
.px:hover{background:#ffe27a}.px:active{transform:translateY(4px);box-shadow:0 2px 0 #0a0a18}
/* 1, 2 */
.screen{position:fixed;inset:0;z-index:10;overflow:hidden;transition:opacity .7s}
.screen[hidden]{display:none}.screen.out{opacity:0;pointer-events:none}
#intro{background:#4b98ee}
#intro img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.ask{position:absolute;left:52%;top:65%;transform:translate(-50%,-50%);width:min(40vw,90%);text-align:center}
.ask h1{font-size:clamp(20px,2.35vw,46px);line-height:1.5;letter-spacing:.05em;text-shadow:0 3px 0 #0a1a44;margin-bottom:1.1em}
.ask div{display:flex;flex-direction:column;gap:clamp(12px,2vh,20px);align-items:center}
.ask .px{width:min(340px,100%);font-size:clamp(16px,1.5vw,24px)}
#burst canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.bt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:#3a2200;opacity:0;visibility:hidden;transition:opacity .6s}
.bt.on{opacity:1;visibility:visible}
.bt h1{font-size:clamp(38px,6vw,88px);letter-spacing:.1em;margin-bottom:.45em}
.bt .px{font-size:clamp(17px,1.7vw,25px)}
.bt h2{font-size:clamp(17px,1.4vw,22px);margin:2em 0 .5em;letter-spacing:.05em}.bt p{font-size:clamp(16px,1.35vw,21px);line-height:1.6;max-width:34em}
/* 3~7 */
#scroll{height:820vh;position:relative}
#stage{position:sticky;top:0;height:100vh;overflow:hidden}
#c{display:block;width:100%;height:100%}
.cap{position:absolute;left:6%;right:6%;top:9vh;text-align:center;pointer-events:none;opacity:0;text-shadow:0 2px 0 #0a0a18,2px 0 0 #0a0a18,-2px 0 0 #0a0a18,0 -2px 0 #0a0a18}
.cap h2{font-size:clamp(30px,4.6vw,62px);letter-spacing:.1em;text-shadow:0 3px 0 #000}
.cap p{margin:14px auto 0;font-size:clamp(16px,1.6vw,22px);line-height:1.65;letter-spacing:.04em;max-width:36em;white-space:pre-line}
.hint{position:absolute;left:50%;bottom:2.5vh;transform:translateX(-50%);font-size:15px;letter-spacing:.14em;text-shadow:0 2px 0 #000;animation:bob 1.4s steps(2) infinite;white-space:nowrap;pointer-events:none}
@keyframes bob{50%{transform:translate(-50%,6px)}}
.dots{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px}
.dots button{width:26px;height:26px;border:0;background:none;padding:0;display:grid;place-items:center}
.dots i{width:11px;height:11px;outline:2px solid #000;transition:transform .2s}.dots .on i{transform:scale(1.6)}
.piece{position:absolute;left:0;top:0;width:76px;height:64px;margin:-64px 0 0 -38px;padding:0;border:0;background:none;opacity:0;visibility:hidden;transition:opacity .4s}
.piece.on{opacity:1;visibility:visible}
.piece span{position:absolute;left:0;right:0;top:-11px;text-align:center;font-size:13px;line-height:1;letter-spacing:.06em;color:#fff;text-shadow:0 1px 0 #0a0a18,1px 0 0 #0a0a18,-1px 0 0 #0a0a18,0 -1px 0 #0a0a18,1px 1px 0 #0a0a18,-1px 1px 0 #0a0a18;animation:fl 1s steps(3) infinite alternate}
.piece svg{width:100%;height:100%;animation:fl 1s steps(3) infinite alternate;filter:drop-shadow(0 0 9px var(--c))}
.piece:hover svg{filter:drop-shadow(0 0 18px var(--c)) brightness(1.15)}
@keyframes fl{to{transform:translateY(-10px)}}
#srcBtn{position:absolute;left:18px;bottom:16px;background:#0a0a18;border:2px solid #fff;padding:6px 12px;font-size:13px;opacity:0;visibility:hidden}#srcBtn.on{opacity:1;visibility:visible}
.dots .home{width:40px;height:40px;margin:0 -7px 8px;background:#0a0a18;border:2px solid #fff}.dots .home:hover{background:#3a3c66}.dots .home svg{width:24px;height:24px}
/* 창 */
dialog{border:6px solid #0a0a18;background:#fbf6e6;color:#1c1a2b;padding:0;width:min(1180px,88vw);height:min(760px,84vh);max-width:none;max-height:none;margin:auto;overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:transparent}
.bar{display:flex;align-items:center;gap:14px;padding:16px 20px 14px;background:#22233f;color:#fff;border-bottom:6px solid #0a0a18;flex:none}
.lamps{display:flex;gap:12px;flex:none}
.lamps i{position:relative;width:24px;height:24px;border-radius:50%;border:3px solid #0a0a18;background:var(--c)}
.lamps i.on{box-shadow:0 0 18px 6px var(--c)}
.bar h2{font-size:clamp(20px,2.7vw,36px);line-height:1.2;letter-spacing:.06em;flex:1;padding-left:6px}
.bar button{width:44px;height:44px;border:3px solid #0a0a18;background:#fff;color:#14142b;font-weight:900;font-size:20px;padding:0}
.bar #back{width:auto;padding:0 14px;font-weight:600;font-size:16px;white-space:nowrap}.bar button:hover{background:#ffe27a}.bar [hidden]{display:none}
.body{overflow:auto;padding:clamp(18px,3vw,36px);flex:1;line-height:1.7;font-size:clamp(15px,1.2vw,18px)}
.foot{position:absolute;right:20px;bottom:16px;display:flex;gap:14px}.foot[hidden]{display:none}
.foot a,.nk a{width:44px;height:44px;border:3px solid #0a0a18;display:grid;place-items:center;text-decoration:none;font-weight:900;font-size:20px;color:#0a0a18}.foot a.n,.nk a.n{background:#03c75a}.foot a.k,.nk a.k{background:#fee500}.foot a:hover,.nk a:hover{filter:brightness(1.1)}.foot a:focus-visible,.nk a:focus-visible{outline-color:#22233f}
.body:has(+ .foot:not([hidden])){padding-bottom:76px}
.nk{display:flex;gap:10px;margin-left:auto;flex:none}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(20px,3vw,40px);align-items:start}
.pic{border:4px solid #0a0a18;background:#bfe0f2;aspect-ratio:4/3;display:flex;align-items:flex-end;justify-content:center;width:100%;overflow:hidden;position:relative}
.pic canvas{image-rendering:pixelated;max-width:86%;max-height:88%}
.pic::after{content:"사진 넣을 자리";position:absolute;right:8px;top:8px;background:#0a0a18;color:#fff;font-size:12px;padding:2px 8px}
.body h3{font-size:1.45em;margin-bottom:.5em}.body p+p{margin-top:.8em}
.todo{color:#75695a}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:32px 36px}
.card{display:flex;gap:16px;align-items:center}
.card .ic{width:108px;height:108px;flex:none;border:4px solid #0a0a18;background:#fff;display:grid;place-items:center}
.goods{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 26px}.goods .ph{aspect-ratio:2/1}
.ph{border:4px solid #0a0a18;background:#ffe9a6;aspect-ratio:4/3;display:grid;place-items:center;color:#75581a;margin-bottom:8px;font-size:14px}
.cast{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;text-align:center;margin-bottom:24px}
.cast figure{margin:0}
.cast div{background-repeat:no-repeat;background-size:800% 100%;background-position:28.571% 0;aspect-ratio:448/480;image-rendering:pixelated}
.map svg{width:100%;border:4px solid #0a0a18;background:#dff0d2;display:block}
.map ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.map li button{width:100%;text-align:left;border:3px solid #0a0a18;background:#fff;padding:8px 12px;display:flex;gap:12px;align-items:center}
.map li button:hover{background:#ffe27a}
.map li b{width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid #0a0a18;display:grid;place-items:center;font-size:14px;flex:none;color:#0a0a18}
table{border-collapse:collapse;width:100%}td,th{border:2px solid #0a0a18;padding:8px 10px;text-align:left;word-break:break-all}
th:last-child,td:last-child{white-space:nowrap}
@media(max-width:760px){.two,.cards{grid-template-columns:1fr}.goods{grid-template-columns:1fr 1fr}.ask{left:50%;width:88%}
 .dots{flex-direction:row;top:10px;right:10px;transform:none;align-items:center}.dots .home{margin:0 6px 0 0}.dots button{width:30px;height:40px}
 .cap{top:72px}.cap p{white-space:normal;text-wrap:balance}
 .card{flex-wrap:nowrap;gap:12px}.card .ic{width:72px;height:72px}.nk{gap:6px}.nk a{width:36px;height:36px;font-size:17px}
 .piece{width:62px;height:52px;margin:-52px 0 0 -31px}
 dialog{width:92vw;height:86vh}.bar{flex-wrap:wrap;gap:10px 12px;padding:12px 16px}.lamps{gap:8px;margin-right:auto}.lamps i{width:18px;height:18px}.bar #back{padding:0 9px;font-size:15px}.bar h2{order:3;flex:0 0 100%;padding:0;font-size:26px}
 .cast{gap:4px}.cast figcaption{font-size:12px;line-height:1.3}
 #wb table,#wb tbody,#wb tr,#wb td{display:block}#wb th{display:none}#wb td{border:0;padding:2px 0}#wb tr+tr{border:2px solid #0a0a18;padding:8px 10px;margin-bottom:10px}}
@media(max-width:760px) and (orientation:portrait){#intro img{object-position:top}
 .ask{left:0;top:0;transform:none;width:100%;height:100%}.ask h1{position:absolute;left:31%;right:27%;top:72vw;font-size:clamp(16px,4.7vw,22px);line-height:1.55;margin:0}.ask h1 .pc{display:none}
 .ask div{position:absolute;left:0;right:0;top:min(120vw,100% - 212px);gap:14px}.ask .px{width:52vw;padding:.8em .4em;font-size:clamp(15px,4.3vw,19px)}}
@media(prefers-reduced-motion:reduce){.piece svg,.piece span,.hint{animation:none}}
</style>

<section class="screen" id="intro">
  <picture><source media="(max-width:760px) and (orientation:portrait)" srcset="img/bulbs-lookdown-m.png"><img src="img/bulbs-lookdown.png" alt="다섯 색 전구들이 나를 내려다보고 있다"></picture>
  <div class="ask"><h1>용사여 빛을 찾으러 가는<br class="pc"> 여정에 함께 해주세요..</h1>
  <div><button class="px">귀여우니까 간다</button><button class="px">불쌍하니까 간다</button><button class="px">이상하니까 간다</button></div></div>
</section>
<section class="screen" id="burst" hidden>
  <canvas id="bc"></canvas>
  <div class="bt" id="bt"><h1>다시 켜지는 하루</h1><button class="px" id="go">빛의 숲에서 빛 조각 모으기</button>
  <h2>빛의 숲 (ACC 지상 정원)</h2><p>ACC는 옛 전남도청 뒤 땅 아래에 지은 복합문화공간이에요.<br>그 위 지상에는 ‘빛의 숲’이 펼쳐져 있어요.</p></div>
</section>

<main id="scroll"><div id="stage">
  <canvas id="c"></canvas><div id="caps"></div><div id="pieces"></div>
  <div class="hint" id="hint"></div><div class="dots" id="dots"></div><button id="srcBtn">출처</button>
</div></main>
<dialog id="win" aria-labelledby="wt"><div class="bar"><div class="lamps" id="lamps"></div><h2 id="wt"></h2><button id="back" hidden>← 지도로</button><button id="x" aria-label="창 닫기">✕</button></div><div class="body" id="wb"></div><div class="foot" id="foot" hidden></div></dialog>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),buf=document.createElement('canvas'),g=buf.getContext('2d');
const PX=4,D=Math.PI/180,STEP=48;let W,H,dpr,bw,bh;
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const hash=(a,b)=>{let h=(a*374761393+b*668265263)^0x5bd1e995;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296};
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`,mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ===== 글: 여기만 고치면 됨. 전구 순서 흰 → 파 → 빨 → 초 → 노 ===== */
const SCENES=[
 {spr:'white',glow:null,c:'#f4f3ff',t:'빛을 잃은 하루',p:'바쁘게 살다 나를 돌보지 못한 전구가 빛을 잃었어요.\n다시 켜지려고 빛고을 광주로 빛 조각을 찾으러 가요.\n혼자서는 다시 빛날 수 없어서 당신의 도움이 필요해요.'},
 {spr:'blue',glow:[70,170,255],c:'#3aa5ff',t:'보고, 파란 빛',p:'ACC 전시와 옛 전남도청, 전일빌딩245를\n천천히 둘러보며 파란 빛 조각을 찾아요.'},
 {spr:'red',glow:[255,80,80],c:'#ff4a4a',t:'먹고, 빨간 빛',p:'충장로와 구시청, 동명동에서\n한 끼를 천천히 즐기며 빨간 빛 조각을 찾아요.'},
 {spr:'green',glow:[100,255,100],c:'#56e04a',t:'걷고, 초록 빛',p:'충장로 골목을 걷고 하늘마당에 누워 쉬며\n초록 빛 조각을 찾아요.'},
 {spr:'yellow',glow:[255,210,100],c:'#ffc53a',t:'빛이 완성됐어요',p:'빨강·초록·파랑 빛이 모여 노란 빛이 켜졌어요.\n함께 걸어 줘서 고마워요.'},
];
/* 항목 창 맨 아래 지도 버튼: 검색어만 고치면 됨 */
// [네이버, 카카오] 순서. 하나만 쓰면 둘 다 같은 검색어
const MAPQ={dochung:['옛 전남도청'],jeonil:['전일빌딩245'],chung:['광주 충장로거리','광주 충장로'],gusi:['광주 구시청','광주 구시청사거리'],dong:['광주 동구 동명동'],hanul:['광주 하늘마당','ACC 하늘마당']};
const nUrl=q=>'https://map.naver.com/p/search/'+encodeURIComponent(q),kUrl=q=>'https://map.kakao.com/link/search/'+encodeURIComponent(q);
const nk=(n,k,t)=>`<a class="n" href="${n}" target="_blank" rel="noopener" title="네이버 지도" aria-label="${t} 네이버 지도에서 보기">N</a><a class="k" href="${k}" target="_blank" rel="noopener" title="카카오맵" aria-label="${t} 카카오맵에서 보기">K</a>`;
/* 빨간 빛 가게 18칸: 가게가 정해지면 이름·설명·네이버 주소(n)·카카오 주소(k)를 채우면 됨. 주소가 비면 동네 검색으로 연결 */
const shops=n=>[1,2,3,4,5,6].map(i=>({name:`${n} 맛집 ${i}`,info:'가게 이름·메뉴·위치 자리',n:'',k:''}));
const SHOPS={gusi:shops('구시청'),chung:shops('충장로'),dong:shops('동명동')};
const todo=s=>`<p class="todo">${s}</p>`;
/* 빛 조각이 뜨는 건물: ph = 앞뒤 각도, lam = 좌우 각도 */
const LM=[
 [{k:'char',n:'캐릭터 소개·스토리',ph:13,lam:-23},{k:'map',n:'지도',ph:14,lam:21}],
 [{k:'acc',n:'ACC 전시',ph:5,lam:-17},{k:'dochung',n:'옛 전남도청',ph:16,mph:37,lam:-29},{k:'jeonil',n:'전일빌딩245',ph:13,lam:22}],
 [{k:'gusi',n:'구시청',ph:15,mph:43.5,lam:-31},{k:'chung',n:'충장로',ph:5,lam:-15},{k:'dong',n:'동명동',ph:12,lam:23}],
 [{k:'hanul',n:'하늘마당',ph:13,lam:-24},{k:'alley',n:'충장로 골목',ph:13,lam:24}],
 [{k:'pam',n:'팜플렛',ph:13,lam:-22},{k:'shop',n:'굿즈샵',ph:13,lam:22}],
];
const BN=['흰 전구','파란 전구','빨간 전구','초록 전구','노란 전구'];
const WIN={
 char:{h:'캐릭터 소개·스토리',html:()=>`<div class="cast">${SCENES.map((s,i)=>`<figure><div style="background-image:url(img/${s.spr}-walk.png?v=3)"></div><figcaption>${BN[i]}</figcaption></figure>`).join('')}</div><h3>빛을 찾으러 온 전구</h3><p>바쁘게 살다 나를 돌보지 못해 하얗게 꺼진 전구예요. 광주(光州)는 ‘빛의 고을’이라는 뜻이라, 다시 빛나기 위해 이곳으로 왔어요.</p><p>보고, 먹고, 걸으며 파랑·빨강·초록 빛 조각을 모으면 노란 빛으로 다시 켜져요.</p>${todo('이름 미정. 정해지면 여기에 들어가요.')}`},
 map:{h:'WORLD MAP',html:mapHTML},
 acc:{h:'ACC 전시',html:()=>pic('acc','ACC(국립아시아문화전당)','<p>옛 전남도청 뒤 땅 아래에 지은 복합문화공간이에요. 전시관과 도서관, 어린이문화원이 있어요.</p>'+todo('지금 열리는 전시 정보를 넣을 자리'))},
 dochung:{h:'옛 전남도청',html:()=>pic('dochung','옛 전남도청','<p>5·18민주화운동의 최후 항쟁지입니다. 2026년 전시관으로 다시 문을 열었습니다.</p>'+todo('관람 시간·해설 안내를 넣을 자리'))},
 jeonil:{h:'전일빌딩245',html:()=>pic('jeonil','전일빌딩245','<p>5·18 당시의 총탄 흔적 245개가 남아 있는 건물입니다.</p>'+todo('관람 시간·해설 안내를 넣을 자리'))},
 gusi:{h:'구시청',html:()=>cards('gusi')},chung:{h:'충장로',html:()=>cards('chung')},dong:{h:'동명동',html:()=>cards('dong')},
 hanul:{h:'하늘마당',html:()=>pic('hanul','하늘마당','<p>ACC 지붕 위에 있는 잔디언덕이에요.</p><p>누워서 풍경을 바라보세요.</p>')},
