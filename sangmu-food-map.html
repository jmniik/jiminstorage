<style>
/* Layout: list rail on the left, map fills the rest; stacks on phones */
:root{--bg:#f6f7f5;--panel:#ffffff;--fg:#1d2420;--muted:#66706a;--line:#e1e5e1;--accent:#03a64a;--star:#e0a100;--font:"Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);display:grid;grid-template-columns:380px 1fr;height:100vh}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:12px;color:var(--muted);line-height:1.5}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.controls select,.controls input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.controls input{flex:1;min-width:120px}
#count{font-size:12px;color:var(--muted);margin-top:8px}
ol{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
li{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:8px}
li:hover,li.on{background:#eef6f0}
.rank{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.nm{font-weight:700;font-size:14px}
.cat{font-size:12px;color:var(--muted);margin-left:4px;font-weight:400}
.meta{font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}
.meta b{color:var(--star)}
.addr{font-size:11.5px;color:var(--muted);margin-top:2px}
#map{height:100%}
.pin{background:var(--accent);color:#fff;border:2px solid #fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:10.5px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.top{background:#d9480f}
.pop a{color:var(--accent);font-weight:700}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:55vh 1fr}aside{order:2;border-right:0}#map{order:1}}
</style>
</head>

const groupOf = (c) => {
  if (/소고기|돼지|육류|고기|곱창|막창|갈비|양꼬치|닭갈비|족발|보쌈|오리|스테이크/.test(c)) return "고기·구이";
  if (/회|초밥|일식|라면|이자카야|덮밥|돈가스|참치|사시미/.test(c)) return "일식·회";
  if (/조개|해물|생선|주꾸미/.test(c)) return "해산물";
  if (/중식|훠궈|마라|베트남|태국|아시아/.test(c)) return "중식·아시아";
  if (/양식|피자|파스타/.test(c)) return "양식";
  if (/주점|맥주|호프|포장마차/.test(c)) return "술집";
  return "한식·기타";
};
DATA.forEach((d, i) => { d.group = groupOf(d.category || ""); });
const sel = document.getElementById("cat");
[...new Set(DATA.map((d) => d.group))].sort().forEach((g) => sel.add(new Option(g + " (" + DATA.filter((d) => d.group === g).length + ")", g)));
const map = L.map("map").setView([35.1515, 126.8510], 15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(map);
const layer = L.layerGroup().addTo(map);
const list = document.getElementById("list");
const fmt = (n) => n.toLocaleString("ko-KR");
function render() {
  const q = document.getElementById("q").value.trim();
  const g = sel.value, s = document.getElementById("sort").value;
  const rows = DATA.filter((d) => (!g || d.group === g) && (!q || (d.name + d.category).includes(q)))
    .sort((a, b) => b[s] - a[s] || b.total - a.total);
  layer.clearLayers(); list.innerHTML = "";
  document.getElementById("count").textContent = rows.length + "곳 표시 중 (전체 " + DATA.length + "곳)";
  rows.forEach((d, i) => {
    const link = "https://map.naver.com/p/entry/place/" + d.id;
    const icon = L.divIcon({ className: "", html: '<div class="pin' + (i < 10 ? " top" : "") + '">' + (i + 1) + "</div>", iconSize: [24, 24], iconAnchor: [12, 12] });
    const m = L.marker([+d.y, +d.x], { icon, zIndexOffset: 1000 - i }).addTo(layer)
      .bindPopup('<div class="pop"><b>' + d.name + "</b> <small>" + d.category + "</small><br>★ " + d.score + " · 방문자 " + fmt(d.visitor) + " · 블로그 " + fmt(d.blog) + "<br><small>" + d.roadAddress + '</small><br><a href="' + link + '" target="_blank">네이버 지도에서 보기 →</a></div>');
    const li = document.createElement("li");
    li.innerHTML = '<div class="rank">' + (i + 1) + '</div><div><div class="nm">' + d.name + '<span class="cat">' + d.category + '</span></div><div class="meta"><b>★ ' + d.score.toFixed(2) + "</b> · 리뷰 " + fmt(d.total) + " (방문자 " + fmt(d.visitor) + ' / 블로그 ' + fmt(d.blog) + ')</div><div class="addr">' + d.roadAddress + "</div></div>";
    li.onclick = () => { document.querySelectorAll("li.on").forEach((x) => x.classList.remove("on")); li.classList.add("on"); map.setView([+d.y, +d.x], 17); m.openPopup(); };
    list.appendChild(li);
  });
}
["q", "cat", "sort"].forEach((id) => document.getElementById(id).addEventListener("input", render));
render();
