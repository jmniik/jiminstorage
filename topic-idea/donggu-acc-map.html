<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACC 중심 동구 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --ink: #1F3A34; --muted: #5C6763; --bg: #FFFFFF; --panel: #F4F7F5;
    --dong: #3E8E7E; --geum: #D95B2E; --chung: #7B4FB8; --acc: #1F3A34;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .wrap { width: 1600px; height: 900px; padding: 28px 36px; display: grid; grid-template-rows: auto 1fr auto; gap: 16px; }
  h1 { margin: 0; font-size: 34px; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 17px; }
  .maps { display: grid; grid-template-columns: 560px 1fr; gap: 20px; min-height: 0; }
  .card { position: relative; background: var(--panel); border-radius: 16px; overflow: hidden; }
  .card h2 { position: absolute; z-index: 500; top: 14px; left: 16px; margin: 0; font-size: 18px; background: rgba(255,255,255,.92); padding: 6px 12px; border-radius: 999px; }
  #overview, #detail { position: absolute; inset: 0; }
  .leaflet-container { background: #FAFBFA; font-family: inherit; }
  .legend { position: absolute; z-index: 500; right: 16px; bottom: 16px; background: rgba(255,255,255,.95); border-radius: 12px; padding: 12px 16px; font-size: 15px; line-height: 1.9; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .sw { display: inline-block; width: 26px; height: 12px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
  .line { height: 6px; }
  .foot { color: var(--muted); font-size: 13px; }
  .lbl { background: none; border: none; box-shadow: none; font-weight: 700; color: var(--ink); font-size: 15px; white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .lbl.big { font-size: 20px; }
  .lbl.dong { color: #1E5C50; font-size: 20px; }
  .lbl.geum { color: var(--geum); font-size: 18px; }
  .lbl.chung { color: var(--chung); font-size: 18px; }
  .lbl.gu { color: var(--muted); font-size: 15px; font-weight: 600; }
  .lbl.dg { color: var(--ink); font-size: 17px; }
  .accpin { background: var(--acc); color: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 15px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>ACC를 중심으로 본 충장로 · 금남로 · 동명동</h1>
    <p class="sub">광주 동구 원도심 · 국립아시아문화전당(ACC)을 가운데 두고 세 곳이 걸어서 이어짐</p>
  </div>
  <div class="maps">
    <div class="card"><h2>광주 전체에서 위치</h2><div id="overview"></div></div>
    <div class="card"><h2>ACC 주변 확대</h2><div id="detail"></div>
      <div class="legend">
        <div><span class="sw" style="background:var(--dong);opacity:.55"></span>동명동 (행정동 경계)</div>
        <div><span class="sw line" style="background:var(--geum)"></span>금남로</div>
        <div><span class="sw line" style="background:var(--chung)"></span>충장로</div>
        <div><span class="sw" style="background:var(--acc)"></span>국립아시아문화전당(ACC)</div>
        <div><span class="sw line" style="background:#8DB8D8"></span>광주천 &nbsp; <span class="sw line" style="background:#9BC79A"></span>푸른길</div>
      </div>
    </div>
  </div>
  <div class="foot">지도 데이터 © OpenStreetMap contributors · 도로와 동 경계는 OpenStreetMap에서 2026-11-16에 가져옴</div>
</div>
