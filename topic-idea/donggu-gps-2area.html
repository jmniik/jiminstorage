const along = f => { const c=f.geometry.coordinates, a=c[0], b=c[c.length-1];

  return Math.abs(((Math.atan2(dy,dx)*180/Math.PI)%180+180)%180 - 140) < 30; };
const roadOK = f => f.properties.kind==="road" && !["service","footway","path"].includes(f.properties.hw) && along(f);

// context

// targets
