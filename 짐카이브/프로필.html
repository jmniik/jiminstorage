<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>짐카이브 프로필</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ddd;font-family:Pretendard,"Malgun Gothic",sans-serif}
.p{width:1080px;height:1080px;display:none;position:relative;overflow:hidden}
.p.on{display:block}
svg text{font-family:Pretendard,"Malgun Gothic",sans-serif}
</style></head><body>

<!-- A: 폴더 + 짐 + AI 반짝이 -->
<section class="p" id="a" style="background:#f4efe6">
<svg width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f3a"/><stop offset="1" stop-color="#1c1f27"/></linearGradient>
    <filter id="sa" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".18"/></filter>
  </defs>
  <!-- back paper sheets -->
  <rect x="330" y="300" width="420" height="300" rx="26" fill="#ffffff" transform="rotate(-8 540 450)" filter="url(#sa)"/>
  <rect x="345" y="290" width="400" height="300" rx="26" fill="#ffd9c7" transform="rotate(6 540 440)"/>
  <!-- folder back with tab -->
  <path d="M250 380 Q250 350 280 350 L450 350 Q470 350 482 366 L506 396 L800 396 Q830 396 830 426 L830 760 Q830 790 800 790 L280 790 Q250 790 250 760 Z" fill="#ff6b4a"/>
  <!-- folder front -->
  <path d="M232 470 Q236 440 266 440 L814 440 Q846 440 842 472 L812 772 Q808 800 778 800 L302 800 Q272 800 268 772 Z" fill="url(#fa)" filter="url(#sa)"/>
  <text x="540" y="705" text-anchor="middle" font-size="250" font-weight="900" fill="#f4efe6" letter-spacing="-8">짐</text>
  <!-- sparkles -->
  <path d="M800 250 C810 300 820 310 870 320 C820 330 810 340 800 390 C790 340 780 330 730 320 C780 310 790 300 800 250 Z" fill="#ff6b4a"/>
  <path d="M880 400 C885 422 890 427 912 432 C890 437 885 442 880 464 C875 442 870 437 848 432 C870 427 875 422 880 400 Z" fill="#2b2f3a"/>
</svg>
</section>

<!-- B: 아카이브 서랍 + 라벨 '짐' -->
<section class="p" id="b" style="background:#1f2430">
<svg width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f0e4"/><stop offset="1" stop-color="#e8dfcd"/></linearGradient>
    <filter id="sb" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <!-- cabinet -->
  <rect x="270" y="250" width="540" height="600" rx="40" fill="url(#db)" filter="url(#sb)"/>
  <line x1="290" y1="550" x2="790" y2="550" stroke="#d6cab3" stroke-width="6"/>
  <!-- top drawer slightly open with cards -->
  <rect x="300" y="285" width="480" height="235" rx="24" fill="#fbf8f1" stroke="#d6cab3" stroke-width="4"/>
  <!-- label holder -->
  <rect x="420" y="330" width="240" height="140" rx="16" fill="#ffffff" stroke="#c9b99a" stroke-width="5"/>
  <text x="540" y="445" text-anchor="middle" font-size="120" font-weight="900" fill="#1f2430" letter-spacing="-4">짐</text>
  <!-- handle bottom drawer -->
  <rect x="300" y="580" width="480" height="235" rx="24" fill="#fbf8f1" stroke="#d6cab3" stroke-width="4"/>
  <rect x="455" y="680" width="170" height="34" rx="17" fill="#ff7a59"/>
  <!-- sparkle -->
  <path d="M820 180 C832 238 844 250 902 262 C844 274 832 286 820 344 C808 286 796 274 738 262 C796 250 808 238 820 180 Z" fill="#ffcf5a"/>
  <path d="M220 820 C226 846 232 852 258 858 C232 864 226 870 220 896 C214 870 208 864 182 858 C208 852 214 846 220 820 Z" fill="#ff7a59"/>
</svg>
</section>

<!-- C: 레터링 짐카이브 스티커 -->
<section class="p" id="c" style="background:#ff6b4a">
<svg width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <filter id="sc" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#7a2410" flood-opacity=".35"/></filter>
  </defs>
  <!-- stacked index cards -->
  <rect x="300" y="330" width="480" height="420" rx="34" fill="#ffd2c2" transform="rotate(-9 540 540)"/>
  <rect x="300" y="330" width="480" height="420" rx="34" fill="#fff6ec" transform="rotate(5 540 540)" filter="url(#sc)"/>
  <!-- tab -->
  <rect x="340" y="300" width="170" height="70" rx="18" fill="#1f2430" transform="rotate(5 540 540)"/>
  <text x="425" y="348" text-anchor="middle" font-size="34" font-weight="800" fill="#fff6ec" transform="rotate(5 540 540)" letter-spacing="2">ARCHIVE</text>
  <g transform="rotate(5 540 540)">
    <text x="540" y="610" text-anchor="middle" font-size="200" font-weight="900" fill="#1f2430" letter-spacing="-10">짐</text>
    <text x="540" y="690" text-anchor="middle" font-size="64" font-weight="800" fill="#ff6b4a" letter-spacing="-1">카이브</text>
  </g>
  <path d="M790 220 C802 276 814 288 870 300 C814 312 802 324 790 380 C778 324 766 312 710 300 C766 288 778 276 790 220 Z" fill="#fff6ec"/>
</svg>
</section>
